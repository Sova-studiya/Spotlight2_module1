<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Spotlight 2 Words</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
  /* Layout: тетрадный лист в клетку; главная → модуль → уровень. Крупные карточки, один синий акцент. */
  :root {
    --paper: #f5f7fb;
    --grid: #e3e9f3;
    --card: #ffffff;
    --ink: #1b2a3d;
    --muted: #55677d;
    --line: #c9d4e4;
    --accent: #2563d6;
    --accent-d: #1a46a0;
    --accent-soft: #e7effd;
    --good: #17895a;
    --good-soft: #d9f3e6;
    --bad: #cf3d3d;
    --bad-soft: #fde3e3;
    --star: #f2ae00;
    --pic: #ffffff;
    --font: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121c29; --grid: #1a2738; --card: #1d2d41; --ink: #edf2f9; --muted: #a9b8cb; --line: #38506c;
      --accent: #6ea4ff; --accent-d: #3d6fc7; --accent-soft: #223a5f;
      --good: #52d69c; --good-soft: #1b4535; --bad: #ff8585; --bad-soft: #4d2525; --star: #ffc933;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121c29; --grid: #1a2738; --card: #1d2d41; --ink: #edf2f9; --muted: #a9b8cb; --line: #38506c;
    --accent: #6ea4ff; --accent-d: #3d6fc7; --accent-soft: #223a5f;
    --good: #52d69c; --good-soft: #1b4535; --bad: #ff8585; --bad-soft: #4d2525; --star: #ffc933;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 18px;
    line-height: 1.35;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    padding-block: 20px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100%;
  }
  button { font-family: inherit; color: inherit; }
  .app { max-width: 1040px; margin: 0 auto; }
  :focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  /* ---------- экраны ---------- */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- кнопки ---------- */
  .btn {
    background: var(--accent); color: #fff; border: 0; border-radius: 16px;
    padding: 14px 24px; min-height: 56px; font-size: 20px; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 0 var(--accent-d); transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  .btn.ghost { background: var(--card); color: var(--accent); border: 3px solid var(--accent); box-shadow: 0 4px 0 var(--accent-d); padding: 11px 22px; }
  .btn.good { background: var(--good); box-shadow: 0 4px 0 #0e6140; color: #fff; }
  .btn.good:active { box-shadow: 0 1px 0 #0e6140; }
  .btn.warn { background: #d4572a; box-shadow: 0 4px 0 #9b3a16; }
  .btn.warn:active { box-shadow: 0 1px 0 #9b3a16; }
  :root[data-theme="dark"] .btn.good, :root:not([data-theme="light"]) .btn.good { color: #08281c; }
  .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 0 0 22px; }

  /* ---------- главная ---------- */
  .home-head { text-align: center; margin: 10px 0 26px; }
  .brand { font-size: clamp(38px, 8vw, 68px); font-weight: 900; letter-spacing: -0.01em; margin: 0; line-height: 1.05; }
  .brand span { color: var(--accent); }
  .tagline { font-size: clamp(19px, 3.6vw, 24px); color: var(--muted); font-weight: 700; margin: 8px 0 0; }
  .modules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .module-card {
    background: var(--card); border: 3px solid var(--line); border-radius: 24px; padding: 18px;
    cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 5px 0 var(--line); transition: transform .12s, border-color .12s;
  }
  .module-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  @media (hover: hover) { .module-card:hover { border-color: var(--accent); } }
  .collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .collage .pic-wrap { aspect-ratio: 1; padding: 6px; }
  .module-name { font-size: 32px; font-weight: 900; margin: 0; line-height: 1.1; }
  .module-sub { font-size: 20px; color: var(--muted); font-weight: 700; margin: 2px 0 0; }
  .module-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
  .count { background: var(--accent-soft); color: var(--accent); font-weight: 800; border-radius: 999px; padding: 6px 14px; font-size: 18px; white-space: nowrap; }
  .meter { font-size: 18px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .meter b { color: var(--star); font-size: 22px; }

  /* ---------- шапки экранов ---------- */
  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn-back {
    background: var(--card); border: 3px solid var(--line); color: var(--ink); border-radius: 16px; min-height: 52px;
    padding: 8px 18px; font-size: 19px; font-weight: 800; cursor: pointer; box-shadow: 0 3px 0 var(--line);
  }
  .btn-back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .pill { background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 8px 16px; font-weight: 800; font-size: 19px; min-height: 52px; display: flex; align-items: center; }
  .pill.progress { color: var(--accent); border-color: var(--accent); }
  .pill.score { color: var(--good); border-color: var(--good); }
  .screen-title { text-align: center; font-size: clamp(28px, 5.5vw, 44px); font-weight: 900; margin: 8px 0 22px; line-height: 1.1; }
  .screen-title small { display: block; font-size: clamp(18px, 3vw, 22px); color: var(--muted); font-weight: 700; margin-top: 4px; }

  /* ---------- уровни ---------- */
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .level-card {
    background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 16px 12px; text-align: center;
    cursor: pointer; box-shadow: 0 5px 0 var(--line); user-select: none; min-height: 168px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .level-card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
  @media (hover: hover) { .level-card:hover { border-color: var(--accent); } }
  .level-num { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 28px; font-weight: 900; display: grid; place-items: center; }
  .level-name { font-size: 20px; font-weight: 800; line-height: 1.2; flex: 1; display: flex; align-items: center; }
  .stars { font-size: 26px; letter-spacing: 2px; white-space: nowrap; }
  .stars .off { opacity: .22; filter: grayscale(1); }

  .range-panel { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 14px 16px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
  .range-panel[hidden] { display: none; }
  .range-panel select { font-family: inherit; font-size: 24px; font-weight: 800; color: var(--ink); background: var(--card); border: 3px solid var(--accent); border-radius: 14px; min-height: 56px; padding: 6px 14px; cursor: pointer; }
  .range-panel .btn { min-height: 56px; padding-block: 10px; }

  /* ---------- картинки ---------- */
  .pic-wrap { background: var(--pic); border-radius: 16px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); }
  .pic { display: block; width: 100%; height: 100%; object-fit: contain; }
  .pic-emoji { font-size: 56px; }

  /* ---------- словарик ---------- */
  .group-title { font-size: 24px; font-weight: 900; color: var(--accent); margin: 26px 0 12px; padding-bottom: 6px; border-bottom: 3px dashed var(--line); }
  .group-title:first-child { margin-top: 0; }
  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
  .word-card {
    background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 12px 12px 16px; text-align: center;
    position: relative; cursor: pointer; box-shadow: 0 4px 0 var(--line);
  }
  .word-card:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--line); }
  .word-card.speaking { border-color: var(--accent); box-shadow: 0 4px 0 var(--accent); }
  .word-card .pic-wrap { height: 150px; padding: 8px; margin-bottom: 10px; }
  .word-text { font-size: 30px; font-weight: 900; line-height: 1.1; word-break: break-word; }
  .word-trans { font-size: 21px; color: var(--muted); font-weight: 700; margin-top: 4px; min-height: 28px; }
  .word-trans.hidden { visibility: hidden; }
  .word-speak {
    position: absolute; top: -10px; right: -10px; width: 46px; height: 46px; z-index: 1; border-radius: 50%; border: 3px solid var(--card);
    background: var(--accent); color: #fff; font-size: 20px; cursor: pointer; display: grid; place-items: center; box-shadow: 0 2px 0 var(--accent-d);
  }

  /* ---------- вопросы ---------- */
  .question-box { background: var(--card); border: 4px solid var(--accent); border-radius: 26px; padding: 20px 16px; text-align: center; margin-bottom: 20px; box-shadow: 0 6px 0 var(--accent-d); }
  .question-box .pic-wrap { height: clamp(130px, 28vh, 230px); width: min(100%, 340px); margin: 0 auto 12px; padding: 8px; }
  .question-emoji { font-size: 68px; line-height: 1; }
  .question-main { font-size: clamp(36px, 8vw, 60px); font-weight: 900; line-height: 1.1; margin: 8px 0 14px; word-break: break-word; }
  .question-main.ru { font-size: clamp(32px, 7vw, 48px); margin-bottom: 0; }
  .question-sub { font-size: 22px; color: var(--muted); font-weight: 700; margin: 0 0 12px; }

  .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .option-btn {
    background: var(--card); border: 3px solid var(--line); border-radius: 20px; padding: 12px; min-height: 84px;
    font-size: clamp(22px, 4.4vw, 30px); font-weight: 800; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--line);
    display: flex; align-items: center; justify-content: center; gap: 12px; text-align: center; overflow-wrap: break-word; word-break: normal; hyphens: manual;
  }
  .option-btn .opt-pic { width: 76px; height: 62px; flex: none; padding: 3px; border-radius: 12px; }
  .option-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); box-shadow: 0 4px 0 var(--good); }
  .option-btn.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
  .mark { font-weight: 900; font-size: 1.1em; }

  .missing-word { font-size: clamp(48px, 12vw, 84px); font-weight: 900; letter-spacing: 6px; margin: 6px 0 10px; word-break: break-all; }
  .missing-slot { display: inline-block; min-width: .8em; border-bottom: 6px solid var(--accent); color: var(--good); margin: 0 3px; }
  .letter-options { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
  .letter-btn { background: var(--card); border: 3px solid var(--accent); border-radius: 16px; width: 76px; height: 76px; font-size: 38px; font-weight: 900; color: var(--accent); cursor: pointer; box-shadow: 0 4px 0 var(--accent-d); }
  .letter-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-d); }
  .letter-btn.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); box-shadow: 0 4px 0 var(--good); }
  .letter-btn.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
  .letter-btn:disabled { cursor: default; }

  .built-word { min-height: 84px; background: var(--card); border: 4px dashed var(--accent); border-radius: 20px; padding: 10px 12px; font-size: clamp(36px, 9vw, 56px); font-weight: 900; text-align: center; letter-spacing: 6px; margin-bottom: 16px; word-break: break-all; }
  .tiles-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
  .tile { background: var(--card); border: 3px solid var(--line); border-radius: 14px; width: 64px; height: 64px; font-size: 34px; font-weight: 900; color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--line); display: grid; place-items: center; }
  .tile:active:not(.used) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .tile.used { opacity: .25; cursor: default; box-shadow: none; }
  .tile.wrong-shake { animation: shake .4s; border-color: var(--bad); }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  .dictation-input { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 16px; font-family: inherit; font-size: 36px; font-weight: 800; text-align: center; border: 4px solid var(--accent); border-radius: 20px; background: var(--card); color: var(--ink); outline: none; letter-spacing: 2px; }
  .dictation-input:focus { box-shadow: 0 0 0 5px var(--accent-soft); }
  .dictation-input.correct { background: var(--good-soft); border-color: var(--good); color: var(--good); }
  .dictation-input.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .hint-text { text-align: center; font-size: 24px; color: var(--muted); margin: 10px 0 0; min-height: 34px; font-weight: 800; }

  /* ---------- финал ---------- */
  .final { background: var(--card); border: 4px solid var(--accent); border-radius: 30px; padding: 30px 20px; text-align: center; box-shadow: 0 6px 0 var(--accent-d); max-width: 600px; margin: 0 auto; }
  .final-emoji { font-size: 84px; line-height: 1; }
  .final-title { font-size: clamp(34px, 7vw, 46px); font-weight: 900; margin: 10px 0; }
  .final-score { font-size: 22px; font-weight: 700; color: var(--muted); margin: 0 0 8px; }
  .final-stars { font-size: 56px; letter-spacing: 8px; margin: 8px 0 20px; }
  .final-stars .off { opacity: .22; filter: grayscale(1); }
  .final-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .final-buttons .btn { min-width: min(100%, 280px); }

  .notice { background: var(--accent-soft); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-size: 17px; text-align: center; margin-bottom: 14px; }

  /* ---------- адаптив ---------- */
  @media (max-width: 860px) {
    .modules { grid-template-columns: 1fr; }
    .module-card { flex-direction: row; align-items: center; flex-wrap: wrap; }
    .module-card .collage { width: 190px; flex: none; }
    .module-card .info { flex: 1; min-width: 160px; }
    .module-card .module-foot { width: 100%; }
    .levels { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 600px) {
    body { font-size: 17px; padding-top: 14px; }
    .module-card .collage { width: 100%; }
    .levels { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .level-card { min-height: 150px; }
    .vocab-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .word-card .pic-wrap { height: 118px; }
    .word-text { font-size: 25px; }
    .word-trans { font-size: 18px; }
    .option-btn { min-height: 76px; padding: 10px 6px; gap: 6px; font-size: 22px; }
    .option-btn:has(.opt-pic) { flex-direction: column; min-height: 130px; }
    .option-btn .opt-pic { width: 100px; height: 72px; }
    .vocab-grid { padding-top: 6px; }
    .tile { width: 54px; height: 54px; font-size: 30px; }
    .letter-btn { width: 66px; height: 66px; font-size: 34px; }
    .btn { font-size: 19px; padding: 12px 18px; }
  }
  @media (max-width: 380px) {
    .options-grid { grid-template-columns: 1fr; }
    .tile { width: 48px; height: 48px; font-size: 26px; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    .question-box { padding: 10px; margin-bottom: 12px; }
    .question-box .pic-wrap { height: 90px; margin-bottom: 4px; }
    .question-main { margin: 2px 0 8px; font-size: 34px; }
    .screen-title { margin: 2px 0 10px; }
    .options-grid { grid-template-columns: repeat(4, 1fr); }
    .option-btn { flex-direction: column; min-height: 66px; font-size: 20px; gap: 4px; }
    .option-btn .opt-pic { width: 52px; height: 38px; }
  }
  @media (min-width: 1100px) {
    body { font-size: 19px; }
    .word-card .pic-wrap { height: 170px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
</style>

<div class="app" id="app">

  <section id="screen-home" class="screen active">
    <div class="home-head">
      <h1 class="brand">Spotlight <span>2</span></h1>
      <p class="tagline">Учим английские слова</p>
    </div>
    <div class="modules" id="modules"></div>
  </section>

  <section id="screen-module" class="screen">
    <div class="top-bar"><button class="btn-back" onclick="goHome()">← Модули</button></div>
    <h2 class="screen-title" id="module-title"></h2>
    <div class="range-panel" id="range-panel" hidden></div>
    <div class="levels" id="levels"></div>
  </section>

  <section id="screen-level" class="screen">
    <div class="top-bar">
      <button class="btn-back" onclick="goModule()">← Уровни</button>
      <div class="pill progress" id="progress-info">1 / 10</div>
      <div class="pill score" id="score-info">✅ 0</div>
    </div>
    <h2 class="screen-title" id="level-title"></h2>
    <div id="notice-slot"></div>
    <div id="level-content"></div>
  </section>

  <section id="screen-final" class="screen">
    <div class="final">
      <div class="final-emoji" id="final-emoji">🎉</div>
      <h2 class="final-title" id="final-title">Молодец!</h2>
      <p class="final-score" id="final-score"></p>
      <div class="final-stars" id="final-stars"></div>
      <div class="final-buttons">
        <button class="btn good" onclick="replayLevel()">🔁 Ещё раз</button>
        <button class="btn" id="btn-next-level" onclick="nextLevel()">➡ Следующий уровень</button>
        <button class="btn ghost" onclick="goModule()">К уровням</button>
      </div>
    </div>
  </section>

</div>

<script>
/* =========================================================
   КАРТИНКИ: вырезаны из карточек и слайдов, вшиты в страницу.

function starURI(n) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 86 : 46, a = -Math.PI / 2 + i * Math.PI / 5;
    pts.push((100 + r * Math.cos(a)).toFixed(1) + "," + (106 + r * Math.sin(a)).toFixed(1));
  }
  const p = pts.join(" "), size = n >= 10 ? 74 : 98, y = n >= 10 ? 130 : 138;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe45c"/><stop offset="1" stop-color="#ffa800"/></linearGradient></defs>
    <polygon points="${p}" fill="#fff" stroke="#fff" stroke-width="26" stroke-linejoin="round"/>
    <polygon points="${p}" fill="url(#g)" stroke="url(#g)" stroke-width="16" stroke-linejoin="round"/>
    <text x="100" y="${y}" text-anchor="middle" font-family="Nunito,'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif" font-weight="900" font-size="${size}" fill="#4a2a08" stroke="#fff" stroke-width="7" paint-order="stroke" stroke-linejoin="round">${n}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

const MODULES = [
  { id:"m1",  title:"Module 1", sub:"My house",           filter: w => w.m === 1, preview:["tree_house","bedroom","bath"].map(k => IMG[k]) },
  { id:"m2",  title:"Module 2", sub:"My birthday",        filter: w => w.m === 2, preview:["birthday","pizza","star"].map(k => k === "star" ? starURI(7) : IMG[k]) },
  { id:"all", title:"Всё вместе", sub:"Случайные слова из модулей", filter: () => true, limit: 30, preview:["chair","burger","happy"].map(k => IMG[k]) }
];

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */
const AGE = 7;
const GRADE = 2;
const USE_TRANSLATION = (AGE < 10) || (GRADE >= 1 && GRADE <= 3);
const RANDOM_LIMIT = 30;        // сколько слов берём в режиме «Всё вместе» (если наберётся)
const ROUND_SIZE = 10;          // слов в одном прохождении уровней 2–7
const SPEECH_LANG = "en-US";
const SPEECH_RATE = AGE < 10 ? 0.75 : 0.85;

const LEVEL_NAMES = [
  "📖 Словарик", "🔤 Слово → перевод", "🔄 Перевод → слово", "🔊 Аудио → слово",
  "✏️ Пропущенная буква", "🧩 Собери слово", "🎧 Диктант"
];

/* =========================================================
   СОСТОЯНИЕ И ХРАНИЛИЩЕ
   ========================================================= */
const $ = id => document.getElementById(id);
let state = {
  mod: null, pool: [], currentLevel: 0, queue: [], currentIndex: 0, correctCount: 0, mistakesCount: 0,
  totalQuestions: 0, baseCount: 0, failed: new Set(), currentQuestion: null,
  showTranslation: true, speechSupported: true, selectedVoice: null, speakToken: 0, _built: [], _target: ""
};

const STORAGE_KEY = "spotlight2_words_progress_v2";
const RANGE_KEY = "spotlight2_words_range_v1";
const MODULE_NUMS = [...new Set(WORDS.map(w => w.m))].sort((a, b) => a - b);
let range = { from: MODULE_NUMS[0], to: MODULE_NUMS[MODULE_NUMS.length - 1] };
try {
  const r = JSON.parse(localStorage.getItem(RANGE_KEY) || "null");
  if (r && MODULE_NUMS.includes(r.from) && MODULE_NUMS.includes(r.to) && r.from <= r.to) range = r;
} catch (e) {}
function saveRange() { try { localStorage.setItem(RANGE_KEY, JSON.stringify(range)); } catch (e) {} }
function rangeWords() { return WORDS.filter(w => w.m >= range.from && w.m <= range.to); }
function rollPool() {
  const picked = new Set(shuffle(rangeWords()).slice(0, RANDOM_LIMIT));
  state.pool = WORDS.filter(w => picked.has(w));       // порядок как в учебнике, чтобы разделы шли подряд
}
function emptyProgress() { const p = {}; MODULES.forEach(m => p[m.id] = {}); return p; }
function loadProgress() {
  const p = emptyProgress();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); MODULES.forEach(m => { if (d[m.id]) p[m.id] = d[m.id]; }); return p; }
    const old = localStorage.getItem("myHouse_vocab_progress_v1");   // прогресс из прошлой версии → Module 1
    if (old) p.m1 = JSON.parse(old);
  } catch (e) {}
  return p;
}
function saveProgress() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {} }
let progress = loadProgress();
const starsOf = (modId, lvl) => (progress[modId] && progress[modId][lvl]) || 0;
const starsHTML = n => [1,2,3].map(i => `<span class="${i <= n ? '' : 'off'}">⭐</span>`).join("");

/* =========================================================
   УТИЛИТЫ
   ========================================================= */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickRandom(arr, n, exclude) { return shuffle(arr.filter(x => x !== exclude)).slice(0, n); }
function picHTML(w, cls) {
  const inner = w.img ? `<img class="pic" src="${w.img}" alt="${w.word}" draggable="false">` : `<span class="pic-emoji">${w.emoji || ''}</span>`;
  return `<div class="pic-wrap ${cls || ''}">${inner}</div>`;
}
const hintOf = w => USE_TRANSLATION ? w.translation : w.definition;

document.addEventListener("click", e => {
  const el = e.target.closest("[data-say]");
  if (el) { e.stopPropagation(); speak(el.dataset.say); }
});

/* =========================================================
   ОЗВУЧКА
   ========================================================= */
function initSpeech() {
  if (!('speechSynthesis' in window)) { state.speechSupported = false; return; }
  const pick = () => {
    const v = speechSynthesis.getVoices();
    if (!v.length) return;
    state.selectedVoice =
      v.find(x => x.lang === "en-US" && /female|samantha|zira|google us/i.test(x.name)) ||
      v.find(x => x.lang === "en-US") || v.find(x => x.lang && x.lang.startsWith("en")) || v[0];
  };
  pick();
  speechSynthesis.onvoiceschanged = pick;
}
function speak(text, onEnd) {
  if (!state.speechSupported) { if (onEnd) onEnd(); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = SPEECH_LANG; u.rate = SPEECH_RATE;
    if (state.selectedVoice) u.voice = state.selectedVoice;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    speechSynthesis.speak(u);
  } catch (e) { if (onEnd) onEnd(); }
}
function stopSpeech() {
  state.speakToken++;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
}

/* =========================================================
   НАВИГАЦИЯ
   ========================================================= */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({ top: 0 });
}
function goHome() { stopSpeech(); renderHome(); showScreen("screen-home"); }
function goModule() { stopSpeech(); renderModule(); showScreen("screen-module"); }

function renderHome() {
  const box = $("modules");
  box.innerHTML = "";
  MODULES.forEach(m => {
    const words = WORDS.filter(m.filter);
    const shown = m.limit ? Math.min(m.limit, words.length) : words.length;
    const got = [1,2,3,4,5,6,7].reduce((s, l) => s + starsOf(m.id, l), 0);
    const card = document.createElement("button");
    card.className = "module-card";
    card.onclick = () => openModule(m.id);
    card.innerHTML = `
      <div class="collage">${m.preview.map(src => `<div class="pic-wrap"><img class="pic" src="${src}" alt="" draggable="false"></div>`).join("")}</div>
      <div class="info">
        <h2 class="module-name">${m.title}</h2>
        <p class="module-sub">${m.sub}</p>
      </div>
      <div class="module-foot">
        <span class="count">${m.limit ? "по " : ""}${shown} слов</span>
        <span class="meter"><b>⭐</b> ${got} / 21</span>
      </div>`;
    box.appendChild(card);
  });
}
function openModule(id) {
  state.mod = MODULES.find(m => m.id === id);
  if (id === "all") rollPool(); else state.pool = WORDS.filter(state.mod.filter);
  goModule();
}
function renderModule() {
  const m = state.mod;
  const isAll = m.id === "all";
  const span = range.from === range.to ? `Module ${range.from}` : `Module ${range.from}–${range.to}`;
  $("module-title").innerHTML = isAll
    ? `${m.title}<small>${span} · ${state.pool.length} слов из ${rangeWords().length}</small>`
    : `${m.title}<small>${m.sub} · ${state.pool.length} слов</small>`;
  renderRangePanel(isAll);
  const grid = $("levels");
  grid.innerHTML = "";
  LEVEL_NAMES.forEach((name, i) => {
    const lvl = i + 1;
    const card = document.createElement("div");
    card.className = "level-card";
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.onclick = () => startLevel(lvl);
    card.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); startLevel(lvl); } };
    card.innerHTML = `<div class="level-num">${lvl}</div><div class="level-name">${name}</div><div class="stars">${starsHTML(starsOf(m.id, lvl))}</div>`;
    grid.appendChild(card);
  });
}

function renderRangePanel(show) {
  const p = $("range-panel");
  p.hidden = !show;
  if (!show) return;
  const opts = sel => MODULE_NUMS.map(n => `<option value="${n}" ${n === sel ? "selected" : ""}>Module ${n}</option>`).join("");
  p.innerHTML = `
    <label for="range-from">С модуля</label>
    <select id="range-from">${opts(range.from)}</select>
    <label for="range-to">по модуль</label>
    <select id="range-to">${opts(range.to)}</select>
    <button class="btn ghost" id="reroll">🎲 Другие слова</button>`;
  $("range-from").onchange = e => { range.from = +e.target.value; if (range.to < range.from) range.to = range.from; applyRange(); };
  $("range-to").onchange = e => { range.to = +e.target.value; if (range.from > range.to) range.from = range.to; applyRange(); };
  $("reroll").onclick = () => { rollPool(); renderModule(); };
}
function applyRange() { saveRange(); rollPool(); renderModule(); }

/* =========================================================
   ЗАПУСК УРОВНЯ
   ========================================================= */
function startLevel(lvl) {
  stopSpeech();
  state.currentLevel = lvl;
  const noSpaces = (lvl === 5 || lvl === 6);
  const pool = noSpaces ? state.pool.filter(w => !w.word.includes(' ')) : state.pool.slice();
  state.queue = lvl === 1 ? pool : shuffle(pool).slice(0, ROUND_SIZE);
  state.currentIndex = 0; state.correctCount = 0; state.mistakesCount = 0;
  state.totalQuestions = state.queue.length;
  state.baseCount = state.queue.length;
  state.failed = new Set();
  $("progress-info").hidden = lvl === 1;
  $("score-info").hidden = lvl === 1;
  showScreen("screen-level");
  $("notice-slot").innerHTML = state.speechSupported ? '' : '<div class="notice">🔇 В этом браузере нет озвучки. Учимся без звука!</div>';
  $("level-title").textContent = LEVEL_NAMES[lvl - 1];
  renderLevel();
}
function updateTopBar() {
  $("progress-info").textContent = `${Math.min(state.currentIndex + 1, state.totalQuestions)} / ${state.totalQuestions}`;
  $("score-info").textContent = `✅ ${state.correctCount}`;
}
function renderLevel() {
  updateTopBar();
  if (state.queue.length === 0) { finishLevel(); return; }
  state.currentQuestion = state.queue[0];
  [null, renderLevel1, renderLevel2, renderLevel3, renderLevel4, renderLevel5, renderLevel6, renderLevel7][state.currentLevel]();
}
function registerCorrect(w) { if (!state.failed.has(w.word)) state.correctCount++; }
function registerMistake(w, requeue) {
  state.mistakesCount++;
  state.failed.add(w.word);
  if (requeue) { state.queue.push(state.queue[0]); state.totalQuestions++; }
}
function nextQuestion() { state.queue.shift(); state.currentIndex++; renderLevel(); }

/* =========================================================
   УРОВЕНЬ 1: СЛОВАРИК
   ========================================================= */
function renderLevel1() {
  $("level-content").innerHTML = `
    <div class="controls">
      <button class="btn" onclick="speakAll()">🔊 Озвучить все</button>
      <button class="btn ghost" onclick="toggleTranslation()">${state.showTranslation ? '🙈 Скрыть перевод' : '👀 Показать перевод'}</button>
      <button class="btn good" onclick="finishLevel()">✅ Готово</button>
    </div>
    <div id="vocab"></div>`;
  const wrap = $("vocab");
  const multi = state.mod.id === "all";
  let lastKey = null, grid = null;
  state.queue.forEach((w, i) => {
    const key = w.m + "|" + w.group;
    if (key !== lastKey) {
      const h = document.createElement("h3");
      h.className = "group-title";
      h.textContent = (multi ? `Module ${w.m} · ` : "") + w.group;
      wrap.appendChild(h);
      grid = document.createElement("div");
      grid.className = "vocab-grid";
      wrap.appendChild(grid);
      lastKey = key;
    }
    const card = document.createElement("div");
    card.className = "word-card";
    card.dataset.say = w.word;
    card.dataset.idx = i;
    card.innerHTML = `
      <button class="word-speak" data-say="${w.word}" aria-label="Озвучить ${w.word}">🔊</button>
      ${picHTML(w)}
      <div class="word-text">${w.word}</div>
      <div class="word-trans ${state.showTranslation ? '' : 'hidden'}">${w.translation}</div>`;
    grid.appendChild(card);
  });
}
function toggleTranslation() { state.showTranslation = !state.showTranslation; renderLevel1(); }
function speakAll() {
  stopSpeech();
  const token = state.speakToken;
  const cards = [...document.querySelectorAll(".word-card")];
  let i = 0;
  const playNext = () => {
    cards.forEach(c => c.classList.remove("speaking"));
    if (token !== state.speakToken || i >= state.queue.length) return;
    cards[i].classList.add("speaking");
    cards[i].scrollIntoView({ block: "center", behavior: "smooth" });
    speak(state.queue[i].word, () => { i++; setTimeout(playNext, 450); });
  };
  playNext();
}

/* =========================================================
   УРОВНИ 2–4: выбор из 4
   ========================================================= */
function markBtn(btn, ok) {
  btn.classList.add(ok ? "correct" : "wrong");
  btn.insertAdjacentHTML("beforeend", `<span class="mark">${ok ? '✓' : '✗'}</span>`);
}
function handleChoice(btn, chosen, correct, speakOnCorrect) {
  const all = [...document.querySelectorAll("#options .option-btn")];
  all.forEach(b => b.disabled = true);
  if (chosen === correct) {
    markBtn(btn, true);
    registerCorrect(correct);
    if (speakOnCorrect) speak(correct.word);
    setTimeout(nextQuestion, 900);
  } else {
    markBtn(btn, false);
    const right = all.find(b => b.dataset.id === correct.word);
    if (right) markBtn(right, true);
    registerMistake(correct, true);
    setTimeout(nextQuestion, 1500);
  }
}
function buildOptions(w, labelFn, speakOnCorrect) {
  const box = $("options");
  shuffle([w, ...pickRandom(state.pool, 3, w)]).forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.dataset.id = opt.word;
    btn.innerHTML = labelFn(opt);
    btn.onclick = () => handleChoice(btn, opt, w, speakOnCorrect);
    box.appendChild(btn);
  });
}
const optWithPic = o => `${picHTML(o, 'opt-pic')}<span>${o.word}</span>`;

function renderLevel2() {
  const w = state.currentQuestion;
  $("level-content").innerHTML = `
    <div class="question-box">
      ${picHTML(w)}
      <div class="question-main">${w.word}</div>
      <button class="btn" data-say="${w.word}">🔊 Послушать</button>
    </div>
    <div class="options-grid" id="options"></div>`;
  buildOptions(w, o => `<span>${hintOf(o)}</span>`, false);
}
function renderLevel3() {
  const w = state.currentQuestion;
  $("level-content").innerHTML = `
    <div class="question-box"><div class="question-main ru">${hintOf(w)}</div></div>
    <div class="options-grid" id="options"></div>`;
  buildOptions(w, optWithPic, true);
}
function renderLevel4() {
  const w = state.currentQuestion;
  $("level-content").innerHTML = `
    <div class="question-box">
      <div class="question-emoji">🎧</div>
      <div class="question-main">?</div>
      <button class="btn" data-say="${w.word}">🔊 Повторить</button>
    </div>
    <div class="options-grid" id="options"></div>`;
  buildOptions(w, optWithPic, false);
  setTimeout(() => speak(w.word), 250);
}

/* =========================================================
   УРОВЕНЬ 5: ПРОПУЩЕННАЯ БУКВА
   ========================================================= */
function getMissingIndex(word) {
  if (word.length <= 4) return 1;
  const v = [];
  for (let i = 1; i < word.length - 1; i++) if ("aeiouy".includes(word[i].toLowerCase())) v.push(i);
  if (v.length) return v[Math.floor(Math.random() * v.length)];
  return 1 + Math.floor(Math.random() * (word.length - 2));
}
function renderLevel5() {
  const w = state.currentQuestion;
  const idx = getMissingIndex(w.word);
  const right = w.word[idx];
  const abc = "abcdefghijklmnopqrstuvwxyz";
  let letters = [right];
  while (letters.length < 4) { const l = abc[Math.floor(Math.random() * 26)]; if (!letters.includes(l)) letters.push(l); }
  letters = shuffle(letters);
  const shown = w.word.substring(0, idx) + '_' + w.word.substring(idx + 1);
  $("level-content").innerHTML = `
    <div class="question-box">
      ${picHTML(w)}
      <div class="missing-word">${shown.split('').map(c => c === '_' ? '<span class="missing-slot">&nbsp;</span>' : c).join('')}</div>
      <div class="question-sub">${hintOf(w)}</div>
      <button class="btn" data-say="${w.word}">🔊 Послушать</button>
      <div class="letter-options" id="letter-options"></div>
    </div>`;
  letters.forEach(l => {
    const btn = document.createElement("button");
    btn.className = "letter-btn";
    btn.textContent = l;
    btn.onclick = () => handleLetterChoice(btn, l, right, w);
    $("letter-options").appendChild(btn);
  });
}
function handleLetterChoice(btn, chosen, correct, w) {
  const all = document.querySelectorAll("#letter-options .letter-btn");
  all.forEach(b => b.disabled = true);
  const slot = document.querySelector(".missing-slot");
  if (chosen === correct) {
    btn.classList.add("correct");
    if (slot) slot.textContent = correct;
    registerCorrect(w); speak(w.word);
    setTimeout(nextQuestion, 1100);
  } else {
    btn.classList.add("wrong");
    all.forEach(b => { if (b.textContent === correct) b.classList.add("correct"); });
    if (slot) slot.textContent = correct;
    registerMistake(w, true);
    setTimeout(nextQuestion, 1500);
  }
}

/* =========================================================
   УРОВЕНЬ 6: СОБЕРИ СЛОВО
   ========================================================= */
function renderLevel6() {
  const w = state.currentQuestion;
  $("level-content").innerHTML = `
    <div class="question-box">
      ${picHTML(w)}
      <div class="question-sub">${hintOf(w)}</div>
      <button class="btn" data-say="${w.word}">🔊 Послушать</button>
    </div>
    <div class="built-word" id="built-word">&nbsp;</div>
    <div class="tiles-row" id="tiles-row"></div>
    <div class="controls">
      <button class="btn warn" onclick="eraseLetter()">🧽 Стереть букву</button>
      <button class="btn ghost" onclick="renderLevel6()">🔄 Заново</button>
    </div>`;
  shuffle(w.word.split('')).forEach(l => {
    const t = document.createElement("button");
    t.className = "tile";
    t.textContent = l;
    t.onclick = () => pickTile(t, l);
    $("tiles-row").appendChild(t);
  });
  state._built = [];
  state._target = w.word;
}
function pickTile(tile, letter) {
  if (tile.classList.contains("used")) return;
  const expected = state._target[state._built.length];
  if (letter.toLowerCase() === expected.toLowerCase()) {
    state._built.push({ letter, tile });
    tile.classList.add("used");
    $("built-word").textContent = state._built.map(b => b.letter).join('');
    if (state._built.length === state._target.length) {
      registerCorrect(state.currentQuestion);
      speak(state._target);
      setTimeout(nextQuestion, 900);
    }
  } else {
    const w = state.currentQuestion;
    if (!state.failed.has(w.word)) registerMistake(w, false);
    tile.classList.add("wrong-shake");
    setTimeout(() => tile.classList.remove("wrong-shake"), 400);
  }
}
function eraseLetter() {
  const last = state._built.pop();
  if (!last) return;
  last.tile.classList.remove("used");
  $("built-word").textContent = state._built.length ? state._built.map(b => b.letter).join('') : ' ';
}

/* =========================================================
   УРОВЕНЬ 7: ДИКТАНТ
   ========================================================= */
function renderLevel7() {
  const w = state.currentQuestion;
  $("level-content").innerHTML = `
    <div class="question-box">
      <div class="question-emoji">🎧</div>
      <div class="question-main">Напиши слово</div>
      <div class="controls" style="margin:0">
        <button class="btn" data-say="${w.word}">🔊 Повторить</button>
        <button class="btn ghost" onclick="showHint7()">💡 Подсказка</button>
      </div>
    </div>
    <input type="text" class="dictation-input" id="dict-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="...">
    <div class="hint-text" id="hint-text"></div>
    <div class="controls" style="margin-top:12px"><button class="btn good" onclick="checkDictation()">✅ Проверить</button></div>`;
  const input = $("dict-input");
  input.addEventListener("keydown", e => { if (e.key === "Enter") checkDictation(); });
  setTimeout(() => input.focus({ preventScroll: true }), 250);
  setTimeout(() => speak(w.word), 300);
}
function showHint7() { $("hint-text").textContent = "Первая буква: " + state.currentQuestion.word[0].toUpperCase(); }
function checkDictation() {
  const input = $("dict-input");
  if (input.disabled) return;
  const w = state.currentQuestion;
  const val = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
  input.disabled = true;
  if (val === w.word.toLowerCase()) {
    input.classList.add("correct");
    registerCorrect(w); speak(w.word);
    setTimeout(nextQuestion, 1000);
  } else {
    input.classList.add("wrong");
    registerMistake(w, true);
    $("hint-text").textContent = "Правильно: " + w.word;
    setTimeout(nextQuestion, 1900);
  }
}

/* =========================================================
   ФИНИШ
   ========================================================= */
function finishLevel() {
  const lvl = state.currentLevel, id = state.mod.id;
  let stars;
  if (lvl === 1 || state.mistakesCount === 0) stars = 3;
  else if (state.mistakesCount <= 2) stars = 2;
  else stars = 1;
  if (starsOf(id, lvl) < stars) { progress[id][lvl] = stars; saveProgress(); }

  $("final-emoji").textContent = stars === 3 ? "🏆" : stars === 2 ? "🎉" : "👍";
  $("final-title").textContent = stars === 3 ? "Отлично!" : stars === 2 ? "Молодец!" : "Хорошо!";
  $("final-score").textContent = lvl === 1
    ? `Ты повторил слов: ${state.baseCount}`
    : `С первой попытки: ${state.correctCount} из ${state.baseCount}`;
  $("final-stars").innerHTML = starsHTML(stars);
  $("btn-next-level").hidden = lvl >= 7;
  stopSpeech();
  showScreen("screen-final");
}
function replayLevel() { startLevel(state.currentLevel); }
function nextLevel() { if (state.currentLevel < 7) startLevel(state.currentLevel + 1); else goModule(); }

/* =========================================================
   СТАРТ
   ========================================================= */
initSpeech();
renderHome();
document.addEventListener("click", () => {
  if ('speechSynthesis' in window) {
    try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
  }
}, { once: true });
</script>
